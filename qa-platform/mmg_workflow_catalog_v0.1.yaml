- workflow_id: WF-DEPOSIT
  workflow_name: Customer/Vendor Deposit Lifecycle
  business_domain: Sales/Purchase → Payments → Accounting (liability)
  description: Take a deposit (fixed/% of order, manual or channel-mapped), track liability, apply to the invoice,
    bill balance, reconcile GL; includes cancel/reset paths.
  business_goal: Money held on account for high-value art is never lost, double-applied, or stuck.
  actors:
  - Gallery Salesperson
  - Accountant
  - Accounting Manager
  starting_state: Deposit accounts/journals configured per company & partner (TC-DEP-002/003/015)
  ending_state: Deposit applied; balance billed; liability relieved; GL reconciles (TC-DEP-014)
  preconditions:
  - deposit account properties on partner (TC-DAT-019)
  required_master_data:
  - customer
  - sales order for %-based deposits
  - deposit journal
  steps:
  - 'record_deposit  # TC-DEP-001 (or from SO: TC-DEP-004/005; or channel: TC-DEP-019)'
  - 'verify_outstanding_on_contact  # TC-DEP-009'
  - create_invoice_from_order
  - 'apply_deposit_to_invoice  # TC-DEP-007'
  - bill_balance
  - 'verify_gl_liability_relieved  # TC-DEP-014'
  state_transitions:
  - 'account.payment (deposit): draft → posted → reconciled'
  - 'liability account: credited → relieved on application'
  business_rules:
  - deposit > invoice leaves residual on account (TC-DEP-017)
  - multiple deposits accumulate (TC-DEP-016)
  - reset-to-draft reverses cleanly (TC-DEP-010/011)
  expected_business_outcomes:
  - customer billed exactly the balance
  - Is-a-Deposit flag preserved on history (TC-DEP-020)
  scenarios:
