- workflow_id: WF-INVSYNC
  workflow_name: Stock Change → Channel Quantity
  business_domain: Inventory → Queue Jobs → Channel (Shopify)
  description: Any stock change reaches the storefront correctly shaped (sync %, min/max caps, exclusions) via delta
    or bulk sync; listing publish-state follows stock.
  business_goal: Never oversell one-of-a-kind art; never show stale stock.
  actors:
  - Inventory Manager
  - E-commerce Manager
  - Integration Admin
  starting_state: 'Channel sync configured: warehouse, percentage, caps, exclusions (TC-FUL-001..007)'
  ending_state: Channel quantity == shaped Odoo quantity; last-sync timestamp advanced; jobs done
  preconditions:
  - listing exists and is mapped
  - sync toggles known (TC-SHP-012)
  required_master_data:
  - products with listings
  - channel warehouse mapping
  steps:
  - configure_sync_shaping
  - 'move_stock  # sale/receipt/adjustment'
  - 'run_delta_sync  # TC-FUL-008 (only changed products push)'
  - verify_pushed_quantities
  - 'run_bulk_sync_with_lock  # TC-FUL-009/010/011'
  - 'verify_listing_publish_state  # TC-SHP-007/008'
  state_transitions:
  - 'listing: published ↔ unpublished at zero stock'
  - 'queue.job per push: pending → done'
  business_rules:
  - shaped qty = min(max(qty×%, min_cap), max_cap) with exclusions
  - in-progress marker blocks duplicate bulk sync (TC-FUL-010)
  expected_business_outcomes:
  - only changed products pushed on delta; timestamp advances
  scenarios:
  - delta_sync_three_products
  - caps_and_percentage
  - exclusion_product
  - exclusion_variant
  - exclusion_category
  - bulk_sync_locking
  - publish_state_zero_stock
  missing_scenarios:
  - zero/negative boundary
  - multi-warehouse aggregation
  - concurrent sync vs order race
  - FTPS delivery in CI (mock)
