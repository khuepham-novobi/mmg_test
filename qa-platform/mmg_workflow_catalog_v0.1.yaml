- workflow_id: WF-O2C-SHOPIFY
  workflow_name: Shopify Order Import to Cash & Sync-Back
  business_domain: Shopify → Queue Jobs → Orders → Payments/Deposits → Fulfillment → Inventory → Shopify
  description: A paid Shopify order imports automatically, process rules confirm/invoice/pay by channel status,
    fulfillment posts back with tracking, inventory decrements and listing publish-state updates.
  business_goal: Storefront orders reach cash and the storefront reflects truth (status, tracking, stock) without
    manual work.
  actors:
  - E-commerce Manager
  - Operations Manager
  - Warehouse Operator
  - Accountant
  - Integration Admin
  starting_state: Connected Shopify store (or replay fixtures); listed product with stock; process rules and gateway
    mappings configured
  ending_state: SO in sale with channel refs; invoice posted & paid via mapped journal/deposit; picking done; fulfillment
    posted w/ tracking; channel qty updated; queue jobs done; omni_log clean
  preconditions:
  - process rules migrated intact (TC-DAT-018)
  - payment gateway → journal/method/deposit mapping (TC-ORD-005)
  - safe mode OFF only for mock/sandbox targets
  required_master_data:
  - channel record with warehouse mapping (TC-SHP-027)
  - listed products with SKU mapping
  - default/guest customer policy (TC-ORD-014)
  steps:
  - place_or_inject_channel_order
  - 'import_orders  # TC-SHP-026/TC-ORD-001'
  - 'resolve_customer  # TC-ORD-014, TC-CHN-007/008'
  - 'apply_order_defaults  # TC-ORD-015/016'
  - 'run_process_rules  # TC-ORD-002/003/004'
  - 'map_payment_and_deposit  # TC-ORD-005, TC-DEP-019'
  - 'fulfill_picking  # TC-SHP-029/030'
  - 'export_fulfillment  # TC-FUL-013/014/015'
  - 'sync_inventory_back  # TC-SHP-009..012, TC-SHP-007/008'
  - 'verify_status_roundtrip  # TC-ORD-017/018'
  state_transitions:
  - 'queue.job: pending → done (TEST_QUEUE_JOB_NO_DELAY in CI)'
  - 'sale.order: imported draft → sale (per rule)'
  - 'account.move: draft → posted → paid (per rule)'
  - 'listing: published ↔ unpublished by stock'
  business_rules:
  - first matching process rule wins (TC-ORD-003)
  - only paid orders auto-progress where configured
  - fulfillment change-detection prevents re-sends (TC-FUL-014)
  expected_business_outcomes:
  - channel total == SO total == invoice total
  - exactly one SO per channel order (idempotency — NEW)
  - stock decremented once; publish state matches stock
  scenarios:
