workflows:
- workflow_id: WF-O2C-GALLERY
  workflow_name: Gallery Direct Sale — Order to Cash
  business_domain: Sales → Inventory → Tax (Avalara) → Accounting → Documents
  description: A gallery salesperson sells an art piece; the flow runs quotation → dollar discount → pickup/delivery
    → Avatax preview → confirm (auto-invoice) → deliver (Legal Sale Date) → invoice (Legal Invoice Date) → post
    (Avalara commit, per-jurisdiction tax lines) → payment (default journal) → reconcile → certificate of authenticity.
  business_goal: Complete an in-gallery/phone sale from quotation to reconciled payment with jurisdiction-correct
    tax, compliance dates and gallery documents.
  actors:
  - Gallery Salesperson
  - Inventory Manager
  - Accountant
  - Gallery Manager
  starting_state: Customer exists or is created; art item in stock (typically qty 1, unique piece)
  ending_state: sale.order=sale, fully delivered & invoiced; picking=done; invoice posted with per-jurisdiction
    tax; payment reconciled; Avalara committed; legal dates stamped; certificate available
  preconditions:
  - Avatax fiscal position configured (TC-DAT-017)
  - auto-invoice setting per company known (TC-SAL-016)
  - default payment journal configured (TC-INV-007/009)
  required_master_data:
  - customer with complete ship-to address
  - art product with catalogue fields, price, tax category
  - warehouse with stock
  steps:
  - create_or_select_customer
  - create_quotation
  - add_art_item_line
  - 'apply_dollar_discount  # x_discount, TC-SAL-006/007'
  - 'set_delivery_or_pickup  # TC-SAL-001/002'
  - 'preview_avatax  # TC-TAX-008'
  - 'confirm_order  # auto-invoice TC-SAL-013..016'
  - 'validate_delivery  # Legal Sale Date TC-LEG-005'
  - 'verify_invoice  # carry-over TC-TAX-010, Legal Invoice Date TC-LEG-006'
  - 'post_invoice  # Avalara commit TC-TAX-011, jurisdiction lines TC-TAX-002/003'
  - 'register_payment  # TC-INV-006/008'
  - 'print_certificate  # TC-LBL-007'
  state_transitions:
  - 'sale.order: draft → sale → done'
  - 'stock.picking: confirmed/assigned → done'
  - 'account.move: draft → posted'
  - 'payment_state: not_paid → in_payment/paid'
  business_rules:
  - dollar discount converts to % on onchange AND write
  - posting blocked when Odoo tax ≠ Avalara summary (TC-TAX-004)
  - legal dates stamped by automated actions 663/664
  - certificate cites most recent CONFIRMED sale only
  expected_business_outcomes:
  - GL receivable cleared; tax payable per jurisdiction account
  - stock on-hand decremented once
  - Avalara transaction committed (voided on cancel)
  scenarios:
  - happy_path (from TC-SAL-017 — steps must be authored)
  - discount_dollar_conversion
  - pickup_at_store
  - deposit_applied (links WF-DEPOSIT)
  - tax_exempt_customer
  - posting_guard_blocks
  - cancel_after_confirm
  - credit_note_refund
  - auto_invoice_disabled
  - multi_order_confirm (known-bug candidate TC-SAL-014)
  - avalara_outage_graceful
  - partial_delivery (NEW — gap G4)
  missing_scenarios:
  - partial delivery/invoice
  - payment failure/decline
  - concurrent confirm double-click
  - role-boundary walk-through
  - multi-currency (confirm scope)
  open_questions:
  - 'TC-LEG-007: is rewriting a posted invoice''s legal date intended?'
  - 'TC-NEW-004: deposits vs native down payments'
  - 'TC-NEW-001: keep/retire mmg_sale_delivery_status'
  coverage_status: 72% scenario-slot coverage; E2E anchor TC-SAL-017 unspecified
  automation_status: not automated; Wave 1 tax core + Wave 2 sales core in workbook
  priority: P0 — MVP
  risk: 'Highest: revenue + tax compliance + 7 subsystems crossing 4 version hops'
