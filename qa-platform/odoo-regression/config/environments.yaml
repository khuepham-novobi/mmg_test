# Target Odoo environments. Values come from .env (see .env.example) —
# nothing here is hard-coded. Add more environments (staging, UAT…) freely;
# each needs a matching adapter version ("15" or "19").
environments:
  odoo15:
    name: "Odoo 15"
    version: "15"
    base_url: "${ODOO15_URL:http://localhost:8015}"
    db: "${ODOO15_DB:odoo15_test}"
    username: "${ODOO15_USERNAME:admin}"
    password: "${ODOO15_PASSWORD:admin}"
    # direct SQL for DATA_RECONCILIATION tests (empty host = SQL tests BLOCKED)
    pg_host: "${ODOO15_PG_HOST:}"
    pg_port: "${ODOO15_PG_PORT:5432}"
    pg_user: "${ODOO15_PG_USER:}"
    pg_password: "${ODOO15_PG_PASSWORD:}"
  odoo19:
    name: "Odoo 19"
    version: "19"
    # Default follows MMG's mmg.conf (http_port = 8076). Override per machine
    # in config/local.yaml. A wrong port surfaces as every test reporting
    # "BLOCKED / ENVIRONMENT — Odoo 19 unreachable at <url>" in the preflight,
    # before any test body runs.
    base_url: "${ODOO19_URL:http://localhost:8076}"
    db: "${ODOO19_DB:mmg_qa19}"
    username: "${ODOO19_USERNAME:admin}"
    password: "${ODOO19_PASSWORD:admin}"
    pg_host: "${ODOO19_PG_HOST:}"
    pg_port: "${ODOO19_PG_PORT:5432}"
    pg_user: "${ODOO19_PG_USER:}"
    pg_password: "${ODOO19_PG_PASSWORD:}"
